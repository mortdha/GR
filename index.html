<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>مراجعة الفصول</title>
<style>
:root{--b:#fff;--t:#1d1d1f;--m:#6b6b70;--l:#dcdce0;--a:#2a5bd7;--h:#fff3bf;--r:#c0392b}
@media(prefers-color-scheme:dark){:root{--b:#1b1b1e;--t:#eee;--m:#9a9aa2;--l:#3a3a40;--a:#4b73d9;--h:#4a4320;--r:#ff6b5b}}
*{box-sizing:border-box}body{margin:0;font:16px/1.7 system-ui,sans-serif;background:var(--b);color:var(--t)}
main{max-width:720px;margin:auto;padding:16px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid var(--l);border-radius:8px;background:transparent}
textarea{min-height:140px}
button{padding:10px 16px;border:1px solid var(--a);background:var(--a);color:#fff;border-radius:8px;cursor:pointer;min-height:44px}
button.g{background:transparent;color:var(--a)}button.d{background:transparent;color:var(--r);border-color:var(--r)}
button:disabled{opacity:.5}
.c{border:1px solid var(--l);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ln{padding:4px 6px;border-radius:6px;cursor:pointer}.ln.n{background:var(--h)}
.m{color:var(--m);font-size:14px}.e{color:var(--r);font-size:14px}
</style></head><body><main id="app">جارٍ التحميل...</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const U='https://dzoluepozbsslorvocwr.supabase.co',K='sb_publishable_iBj-QXz3Uaj5QrwkjNsnhw_cMt1MR_w';
const sb=supabase.createClient(U,K),$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const em=c=>'s'+c.toLowerCase()+'@students.example.com';
const gen=()=>{const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';crypto.getRandomValues(new Uint8Array(8)).forEach(x=>s+=a[x%a.length]);return s};
let me=null,role=null,stu=null,CS=[],cur=null,R=null,blob=null,tmr;
function say(m,e){const x=$('#msg');if(x){x.className=e?'e':'m';x.textContent=m}}
async function out(){await sb.auth.signOut();login()}

async function boot(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return login();
 const {data:t}=await sb.from('teachers').select('*').maybeSingle();
 if(t){role='t';me=t;return tHome()}
 const {data:s}=await sb.from('students').select('*').maybeSingle();
 if(s){role='s';me=s;sb.rpc('activate_me');return sHome()}
 await sb.auth.signOut();login('هذا الحساب غير مرتبط بأستاذ أو طالب.')}

function login(m){A.innerHTML=`<h2>مراجعة الفصول</h2>
<div class="row"><button class="g" onclick="lm('s')">طالب</button><button class="g" onclick="lm('t')">أستاذ</button><button class="g" onclick="lm('r')">تسجيل أستاذ جديد</button></div>
<div id="f"></div><p id="msg" class="e">${esc(m||'')}</p>`;lm('s')}
function lm(k){$('#f').innerHTML={
s:`<input id="a" placeholder="اسمك"><input id="b" placeholder="الرمز السري" autocapitalize="none"><button onclick="inS()">دخول</button>`,
t:`<input id="a" type="email" placeholder="البريد"><input id="b" type="password" placeholder="كلمة السر"><button onclick="inT()">دخول</button>`,
r:`<input id="n" placeholder="الاسم"><input id="a" type="email" placeholder="البريد"><input id="b" type="password" placeholder="كلمة السر (6 فأكثر)"><input id="c" placeholder="رمز الدعوة"><button onclick="reg()">تسجيل</button>`}[k]}

async function inS(){const n=$('#a').value,c=$('#b').value.trim();if(!n||!c)return say('اكتب الاسم والرمز',1);
 const {error}=await sb.auth.signInWithPassword({email:em(c),password:c.toLowerCase()});
 if(error)return say('الاسم أو الرمز غير صحيح',1);
 const {data:s}=await sb.from('students').select('*').maybeSingle();
 if(!s||norm(s.name)!==norm(n)){await sb.auth.signOut();return say('الاسم أو الرمز غير صحيح',1)}
 boot()}
async function inT(){const {error}=await sb.auth.signInWithPassword({email:$('#a').value.trim(),password:$('#b').value});
 if(error)return say('البريد أو كلمة السر غير صحيحة',1);boot()}
async function reg(){const n=$('#n').value,e=$('#a').value.trim(),p=$('#b').value,c=$('#c').value;
 if(!n||!e||!p||!c)return say('املأ كل الحقول',1);
 let r=await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){r=await sb.auth.signUp({email:e,password:p});if(r.error)return say(r.error.message,1)}
 const {error}=await sb.rpc('register_teacher',{p_name:n,p_code:c});
 if(error)return say(error.message.includes('bad_code')?'رمز الدعوة غير صالح أو مستخدم':error.message,1);boot()}

/* ===== الأستاذ ===== */
const mk=async()=>{const c=gen();
 const s2=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}});
 const {data,error}=await s2.auth.signUp({email:em(c),password:c});
 return error?{error}:{c,uid:data.user.id}};
async function tHome(){const {data:s=[]}=await sb.from('students').select('*').order('created_at');
 A.innerHTML=`<div class="row"><b>${esc(me.name)}</b><button class="g" onclick="out()">خروج</button></div>
 <div class="c"><b>+ إضافة طالب</b><input id="sn" placeholder="اسم الطالب"><button onclick="addS()">إضافة</button><p id="msg" class="m"></p></div>
 ${s.map(x=>`<div class="c"><b>${esc(x.name)}</b> <span class="m">${x.activated?'مفعّل':'لم يدخل بعد'}</span><div class="row"><button onclick="openS('${x.id}')">فتح</button><button class="g" onclick="reset('${x.id}')">رمز جديد</button><button class="d" onclick="delS('${x.id}')">حذف</button></div></div>`).join('')||'<p class="m">لا طلاب بعد</p>'}`}
async function addS(){const n=$('#sn').value.trim();if(!n)return;say('جارٍ الإنشاء...');
 const r=await mk();if(r.error)return say(r.error.message,1);
 const {error}=await sb.from('students').insert({teacher_id:me.id,name:n,auth_uid:r.uid});
 if(error)return say(error.message,1);await tHome();say(`رمز ${n}: ${r.c} — يظهر مرة واحدة فقط، أرسله له الآن.`)}
async function reset(id){if(!confirm('الرمز الجديد يلغي القديم. متابعة؟'))return;
 const r=await mk();if(r.error)return say(r.error.message,1);
 await sb.from('students').update({auth_uid:r.uid,activated:false}).eq('id',id);await tHome();say('الرمز الجديد: '+r.c+' (يظهر مرة واحدة)')}
const files=c=>(c.notes||[]).filter(n=>n.a).map(n=>n.a);
async function delCh(c){const f=files(c);if(f.length)await sb.storage.from('voice').remove(f);return sb.from('chapters').delete().eq('id',c.id)}
async function delS(id){if(!confirm('حذف الطالب وكل فصوله وبصماته؟'))return;
 const {data:cs=[]}=await sb.from('chapters').select('*').eq('student_id',id);
 for(const c of cs)await delCh(c);await sb.from('students').delete().eq('id',id);tHome()}
async function openS(id){stu=id;
 const {data:cs=[]}=await sb.from('chapters').select('*').eq('student_id',id).order('created_at');CS=cs;
 A.innerHTML=`<button class="g" onclick="tHome()">رجوع</button>${cs.map((c,i)=>`<div><button class="g" onclick="showC('${c.id}')">النسخة ${i+1}: ${esc(c.title)}</button></div>`).join('')||'<p class="m">لم يرفع الطالب فصلاً بعد</p>'}<div id="ch"></div>`;
 if(cs.length)showC(cs[cs.length-1].id)}

/* ===== عرض الفصل (للاثنين) ===== */
function showC(id){cur=CS.find(c=>c.id==id);const nl=new Set((cur.notes||[]).map(n=>n.l));
 $('#ch').innerHTML=`<h3>${esc(cur.title)}</h3><p class="m">اضغط على أي سطر${role=='t'?' لكتابة ملاحظة أو تسجيل بصمة':' لرؤية الملاحظات (الأسطر الملوّنة عليها ملاحظات)'}</p>${cur.body.split('\n').map((t,i)=>`<div class="ln ${nl.has(i)?'n':''}" onclick="ln(${i})">${esc(t)||'&nbsp;'}</div>`).join('')}<div id="np"></div>`}
function ln(i){blob=null;const ns=(cur.notes||[]).filter(n=>n.l==i);
 $('#np').innerHTML=`<div class="c"><div class="m">السطر ${i+1}</div>
 ${ns.map(n=>`<div class="row">${esc(n.t||'')}${n.a?`<button class="g" onclick="play('${n.a}',this)">▶ بصمة</button>`:''}${role=='t'?`<button class="d" onclick="rmN('${n.id}')">حذف</button>`:''}</div>`).join('')||'<p class="m">لا ملاحظات</p>'}
 <audio id="pv" controls hidden style="width:100%"></audio>
 ${role=='t'?`<textarea id="nt" style="min-height:70px" placeholder="ملاحظة مكتوبة (اختياري)"></textarea><div class="row"><button class="g" id="rc" onclick="rec()">🎤 تسجيل</button><span id="tm" class="m"></span><button onclick="saveN(${i})">حفظ</button></div><p id="msg" class="m"></p>`:''}</div>`;
 $('#np').scrollIntoView({behavior:'smooth'})}
async function play(p,b){b.disabled=true;const {data,error}=await sb.storage.from('voice').createSignedUrl(p,300);b.disabled=false;
 if(error)return alert('تعذر التشغيل');const a=$('#pv');a.hidden=false;a.src=data.signedUrl;a.play().catch(()=>{})}

/* ===== تسجيل الصوت (للأستاذ) ===== */
async function rec(){const b=$('#rc');if(R){R.stop();return}
 if(!navigator.mediaDevices||!window.isSecureContext)return say('الميكروفون غير متاح هنا. افتح الرابط (https) في Chrome أو Safari.',1);
 b.disabled=true;let st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){b.disabled=false;return say(e.name=='NotAllowedError'?'تم رفض إذن الميكروفون. فعّله من إعدادات الموقع.':'تعذر فتح الميكروفون ('+e.name+')',1)}
 b.disabled=false;
 const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
 try{R=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000})}
 catch(e){st.getTracks().forEach(t=>t.stop());return say('المتصفح لا يدعم التسجيل',1)}
 const ch=[];let s=0;R.ondataavailable=e=>ch.push(e.data);
 R.onstop=()=>{clearInterval(tmr);st.getTracks().forEach(t=>t.stop());blob=new Blob(ch,{type:R.mimeType||mt});R=null;
  b.textContent='🎤 إعادة';$('#tm').textContent='تم التسجيل ('+Math.round(blob.size/1024)+' KB)'};
 R.start();b.textContent='⏹ إيقاف';
 tmr=setInterval(()=>{s++;$('#tm').textContent=s+' / 60 ث';if(s>=60&&R)R.stop()},1000)}
async function saveN(i){const t=$('#nt').value.trim();if(!t&&!blob)return say('اكتب ملاحظة أو سجّل بصمة',1);
 if(R)return say('أوقف التسجيل أولاً',1);
 const id=crypto.randomUUID(),n={id,l:i,t};
 if(blob){const mt=(blob.type||'audio/mp4').split(';')[0],ext=mt.includes('mp4')?'m4a':'webm',p=`${stu}/${cur.id}/${id}.${ext}`;
  say('جارٍ رفع الصوت...');
  const {error}=await sb.storage.from('voice').upload(p,blob,{contentType:mt});
  if(error)return say('فشل رفع الصوت: '+error.message,1);n.a=p}
 const notes=[...(cur.notes||[]),n];
 const {error}=await sb.from('chapters').update({notes}).eq('id',cur.id);
 if(error)return say(error.message,1);cur.notes=notes;blob=null;showC(cur.id);ln(i)}
async function rmN(id){const n=cur.notes.find(x=>x.id==id);if(n.a)await sb.storage.from('voice').remove([n.a]);
 const notes=cur.notes.filter(x=>x.id!=id);await sb.from('chapters').update({notes}).eq('id',cur.id);cur.notes=notes;showC(cur.id)}

/* ===== الطالب ===== */
async function sHome(){const {data:cs=[]}=await sb.from('chapters').select('*').order('created_at');CS=cs;stu=me.id;
 A.innerHTML=`<div class="row"><b>${esc(me.name)}</b><button class="g" onclick="out()">خروج</button></div>
 ${cs.map((c,i)=>`<div class="row"><button class="g" onclick="showC('${c.id}')">النسخة ${i+1}: ${esc(c.title)}</button><button class="d" onclick="delC('${c.id}')">حذف</button></div>`).join('')}
 <div id="ch"></div>
 ${cs.length<2?`<div class="c"><b>رفع فصل${cs.length?' معدّل':''}</b><input id="ti" placeholder="عنوان الفصل"><textarea id="bo" placeholder="الصق نص الفصل هنا"></textarea><button onclick="up()">رفع</button><p id="msg" class="m"></p></div>`:'<p class="m">لديك نسختان. لرفع نسخة جديدة احذف الأولى بعد أن تطبّق ملاحظاتها.</p>'}`;
 if(cs.length)showC(cs[cs.length-1].id)}
async function up(){const t=$('#ti').value.trim(),b=$('#bo').value;if(!t||!b.trim())return say('اكتب العنوان والنص',1);
 const {error}=await sb.from('chapters').insert({student_id:me.id,title:t,body:b});
 if(error)return say(error.message.includes('max_two')?'لديك نسختان. احذف الأولى أولاً.':error.message,1);sHome()}
async function delC(id){const c=CS.find(x=>x.id==id);
 if(!confirm('حذف هذه النسخة بملاحظاتها وبصماتها نهائياً؟ تأكد أنك طبّقت الملاحظات.'))return;await delCh(c);sHome()}

boot();
</script></body></html>
