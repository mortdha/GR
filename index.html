<style>

</style></head><body><main id="app"></main>

<script>
const U='https://dzoluepozbsslorvocwr.supabase.co',K='sb_publishable_iBj-QXz3Uaj5QrwkjNsnhw_cMt1MR_w';

 const {data:{session}}=await sb.auth.getSession();if(!session){home();const o=rd();if(o.auto&&o[o.last]){lm(o.last);if(o.last=='t')inT();else inS()}return}
 const {data:t}=await sb.from('teachers').select('*').maybeSingle();
 if(t){role='t';me=t;return tHome()}
 const {data:s}=await sb.from('students').select('*').maybeSingle();
 if(s){role='s';me=s;await sb.rpc('activate_me');return sHome()}
 await sb.auth.signOut();home('هذا الحساب غير مرتبط بأستاذ أو طالب.')}

function home(m){A.innerHTML=`<div class="hero"><div class="logo">📖</div><h1>مراجعة الفصول</h1><p class="m">اختر نوع الدخول</p>
<div class="two"><button class="big t" onclick="lm('t')"><svg viewBox="0 0 64 64"><path d="M32 12 4 26l28 14 28-14z" fill="currentColor"/><path d="M16 34v10c0 4 7 8 16 8s16-4 16-8V34l-16 8z" fill="currentColor" opacity=".75"/><path d="M56 28v18" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><circle cx="56" cy="49" r="3.5" fill="#f5c542"/></svg><span>أستاذ</span></button><button class="big" onclick="lm('s')"><svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="12" fill="currentColor"/><path d="M8 58c0-14 10-22 24-22s24 8 24 22z" fill="currentColor"/></svg><span>طالب</span></button></div>
<div id="f"></div><p id="msg" class="e">${esc(m||'')}</p>
<p class="ft"><a href="https://t.me/Mortdh190" target="_blank" rel="noopener noreferrer">مرتضى الدحيدحاوي ©</a></p></div>`}
function lm(k){$('#f').innerHTML=`<div class="card"><input id="a" placeholder="${k=='t'?'اسمك':'اسمك'}" autocomplete="off">
<input id="b" placeholder="${k=='t'?'الرمز الخاص بك':'الرمز السري الذي أعطاك إياه أستاذك'}" autocapitalize="none" autocomplete="off">
<button style="width:100%;margin-top:8px" onclick="${k=='t'?'inT()':'inS()'}">دخول</button>${rd()[k]?`<button class="g" style="width:100%;margin-top:10px" onclick="fg('${k}')">نسيان الحساب المحفوظ</button>`:''}</div>`;const v=rd()[k];if(v){$('#a').value=v.n;$('#b').value=v.c}$('#a').focus()}
function fg(k){const o=rd();delete o[k];wr(o);lm(k)}

async function inS(){const n=$('#a').value,c=$('#b').value.trim();if(!n||!c)return say('اكتب الاسم والرمز',1);
 const {error}=await sb.auth.signInWithPassword({email:emS(c),password:c.toLowerCase()});
 if(error)return say('الاسم أو الرمز غير صحيح',1);
 const {data:s}=await sb.from('students').select('*').maybeSingle();
 if(!s||norm(s.name)!==norm(n)){await sb.auth.signOut();return say('الاسم أو الرمز غير صحيح',1)}
 sv('s',n.trim(),c);boot()}
async function inT(){const n=$('#a').value.trim(),c=$('#b').value.replace(/[\s"'“”]+/g,'');if(!n||!c)return say('اكتب الاسم والرمز',1);
 const e=emT(c),p=c.toLowerCase();say('جارٍ الدخول...');
 let r=await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){r=await sb.auth.signUp({email:e,password:p});if(r.error)return say('تعذر إنشاء الحساب: '+r.error.message,1);if(!r.data.session)return say('تأكيد البريد ما زال مفعلاً في Supabase أو توجد محاولة سابقة معلّقة.',1)}
 const {data:t}=await sb.from('teachers').select('*').maybeSingle();
 if(!t){const {error}=await sb.rpc('register_teacher',{p_name:n,p_code:c});
  if(error){await sb.auth.signOut();return say(error.message.includes('bad_code')?'الرمز غير صالح أو مستخدم من أستاذ آخر':'خطأ: '+error.message,1)}sv('t',n,c);return boot()}
 if(norm(t.name)!==norm(n)){await sb.auth.signOut();return say('الاسم أو الرمز غير صحيح',1)}
 sv('t',n,c);boot()}

/* ===== الأستاذ ===== */
const mk=async()=>{const c=gen();
 const s2=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}});
 const {data,error}=await s2.auth.signUp({email:emS(c),password:c});
 return error?{error}:{c,uid:data.user.id}};
async function tHome(){const {data:s=[]}=await sb.from('students').select('*').order('created_at');ST=s;
 const {data:cl=[]}=await sb.from('chapters').select('student_id,created_at');const LT={};cl.forEach(c=>{if(!LT[c.student_id]||c.created_at>LT[c.student_id])LT[c.student_id]=c.created_at});
 const nw=x=>{let v=null;try{v=localStorage.getItem('ls_'+x.id)}catch(e){}return LT[x.id]&&(!v||LT[x.id]>v)};
 A.innerHTML=`<div class="row sp"><h3>أهلاً ${esc(me.name)}</h3><button class="g" onclick="out()">خروج</button></div>
 <div class="card"><b>+ إضافة طالب</b><input id="sn" placeholder="اسم الطالب"><button onclick="addS()">إضافة</button><p id="msg" class="m"></p></div>
 <div class="grid">${s.map(x=>`<div class="card"><div class="row"><div class="av">${esc(x.name[0])}</div><div><b>${esc(x.name)}</b>${nw(x)?' <span class="tag on">فصل جديد</span>':''}</div></div>
 <div class="row"><button onclick="openS('${x.id}')">فتح</button><button class="g" onclick="cp('${x.id}',this)">نسخ الرمز</button><button class="d" onclick="delS('${x.id}')">حذف</button></div></div>`).join('')}</div>
 ${s.length?'':'<p class="m">لا طلاب بعد</p>'}`}
async function addS(){const n=$('#sn').value.trim();if(!n)return;say('جارٍ الإضافة...');
 const r=await mk();if(r.error)return say(r.error.message,1);
 const {error}=await sb.from('students').insert({teacher_id:me.id,name:n,auth_uid:r.uid,code:r.c});
 if(error)return say(error.message,1);await tHome();say('✓ تمت إضافة '+n+'. اضغط «نسخ الرمز» لإرساله له.',2)}
async function cp(id,b){const x=ST.find(y=>y.id==id);
 if(!x.code){b.disabled=true;b.textContent='جارٍ الإنشاء...';const r=await mk();
  if(r.error){b.disabled=false;b.textContent='نسخ الرمز';return alert(r.error.message)}
  await sb.from('students').update({auth_uid:r.uid,code:r.c,activated:false}).eq('id',id);x.code=r.c;b.disabled=false}
 try{await navigator.clipboard.writeText(x.code)}catch(e){prompt('انسخ الرمز:',x.code)}
 b.textContent='✓ تم النسخ';setTimeout(()=>b.textContent='نسخ الرمز',1600)}
const dr=n=>/^(د\.|د |الدكتور|دكتور|أ\.|الأستاذ|أستاذ|استاذ)/.test(n.trim())?n.trim():'د. '+n.trim();
const files=c=>(c.notes||[]).filter(n=>n.a).map(n=>n.a);
async function delCh(c){const f=files(c);if(f.length)await sb.storage.from('voice').remove(f);return sb.from('chapters').delete().eq('id',c.id)}
async function delS(id){if(!confirm('حذف الطالب وكل فصوله وبصماته؟'))return;
 const {data:cs=[]}=await sb.from('chapters').select('*').eq('student_id',id);
 for(const c of cs)await delCh(c);await sb.from('students').delete().eq('id',id);tHome()}
async function openS(id){stu=id;
 const {data:cs=[]}=await sb.from('chapters').select('*').eq('student_id',id).order('created_at');CS=cs;if(cs.length)try{localStorage.setItem('ls_'+id,cs.reduce((m,c)=>c.created_at>m?c.created_at:m,''))}catch(e){}
 A.innerHTML=`<button class="g" onclick="tHome()">→ رجوع</button><div id="pl"></div><div id="ch"></div>${cs.length?'':'<p class="m">لم يرفع الطالب فصلاً بعد</p>'}`;
 if(cs.length)showC(cs[cs.length-1].id)}

/* ===== عرض الفصل ===== */
function fz(d){FS=Math.max(14,Math.min(30,FS+d*2));$('.paper').style.fontSize=FS+'px'}
function fnd(q){q=q.trim();const els=[...document.querySelectorAll('.paper .ln')];els.forEach(e=>e.classList.remove('hit'));if(!q)return;const hs=els.filter(e=>e.textContent.includes(q));hs.forEach(e=>e.classList.add('hit'));if(hs[0])hs[0].scrollIntoView({block:'center',behavior:'smooth'})}
const lsOf=c=>{let o=0;return c.body.split('\n').map(x=>{const r=[o,x];o+=x.length+1;return r})};
const rngs=(c,L)=>(c.notes||[]).map(n=>{if(n.o1!=null)return{n,a:n.o1,b:n.o2};const i=Math.min(n.l,L.length-1),j=Math.min(n.e??n.l,L.length-1);return{n,a:L[i][0],b:L[j][0]+L[j][1].length}});
function seg(t,base,R){const cuts=new Set([0,t.length]);
 R.forEach(r=>[r.a-base,r.b-base].forEach(p=>{if(p>0&&p<t.length)cuts.add(p)}));
 const P=[...cuts].sort((x,y)=>x-y);let h='';
 for(let k=0;k<P.length-1;k++){const a=P[k],b=P[k+1],txt=esc(t.slice(a,b));
  const ids=R.filter(r=>r.a<base+b&&r.b>base+a).map(r=>r.n);
  h+=ids.length?`<mark class="mk${ids.every(n=>n.done)?' dn':''}" data-ids="${ids.map(n=>esc(n.id)).join(',')}">${txt}</mark>`:txt}
 return h}
function rows(c){const L=lsOf(c),R=rngs(c,L);
 const od=CMP&&CS.length==2&&c.id==CS[1].id?new Set(CS[0].body.split('\n').map(x=>x.trim())):null;let h='',t=0;
 L.forEach(([o,x],i)=>{const tb=x.includes('\t'),df=od&&x.trim()&&!od.has(x.trim());
  if(tb&&!t){h+='<div class="tw"><table>';t=1}if(!tb&&t){h+='</table></div>';t=0}
  const k='ln'+(df?' df':'');
  if(tb){let b=o;h+=`<tr class="${k}">${x.split('\t').map(y=>{const td=`<td data-o="${b}">${seg(y,b,R)||'&nbsp;'}</td>`;b+=y.length+1;return td}).join('')}</tr>`}
  else h+=`<div class="${k}" data-o="${o}">${seg(x,o,R)||'&nbsp;'}</div>`});
 return h+(t?'</table></div>':'')}
function showC(id){cur=CS.find(c=>c.id==id);
 const pl=CS.map((c,i)=>`<button class="g ${c.id==id?'act':''}" onclick="showC('${c.id}')">النسخة ${i+1}</button>`).join('');
 if(role=='t')$('#pl').innerHTML=`<div class="pills">${pl}</div>`;
 const second=CS.length==2&&cur.id==CS[1].id;
 const hint=role=='t'?'حدّد أي جزء من النص (بالضغط المطوّل ثم سحب المؤشر) ثم اضغط «ملاحظة على المحدد».':((cur.notes||[]).length?'الأجزاء الملوّنة عليها ملاحظات من مشرفك، اضغط عليها لتقرأ وتسمع.':'قم بإبلاغ مشرفك عن طريق التلغرام أو واتساب أو الاتصال بأنك رفعت الفصل، وانتظر دخوله وكتابة ملاحظاته.');
 $('#ch').innerHTML=`${role=='s'?`<div class="pills">${pl}</div>`:''}<h3>${esc(cur.title)}</h3><p class="m">${hint}</p>
 <div class="row"><button class="g" onclick="fz(1)">A+</button><button class="g" onclick="fz(-1)">A−</button><input placeholder="بحث في الفصل" oninput="fnd(this.value)" style="flex:1;min-width:140px;width:auto;margin:0">${second?`<button class="g" onclick="CMP=!CMP;showC('${cur.id}')">${CMP?'إخفاء التغييرات':'إظهار ما تغيّر عن النسخة الأولى'}</button>`:''}</div>
 <div class="paper" style="font-size:${FS}px">${rows(cur)}</div><div class="sheet" id="np"></div>
 ${role=='t'?'<button id="sb" class="selbar" onpointerdown="clearTimeout(hb)" onclick="newN()">💬 ملاحظة على المحدد</button>':''}`}
/* ===== تحديد جزء من النص ===== */
function pt(node,off){const el=(node.nodeType==1?node:node.parentElement).closest('[data-o]');if(!el||!el.closest('.paper'))return null;
 const r=document.createRange();r.setStart(el,0);r.setEnd(node,off);return +el.dataset.o+r.toString().length}
function gs(){const g=getSelection();if(!g.rangeCount||g.isCollapsed||!cur)return null;const r=g.getRangeAt(0);
 let a=pt(r.startContainer,r.startOffset),b=pt(r.endContainer,r.endOffset);if(a==null||b==null)return null;
 if(b<a)[a,b]=[b,a];const q=cur.body.slice(a,b);a+=q.match(/^\s*/)[0].length;b-=q.match(/\s*$/)[0].length;
 return b>a?{s:a,e:b}:null}
document.addEventListener('selectionchange',()=>{const bar=$('#sb');if(role!='t'||!bar)return;const g=gs();clearTimeout(hb);
 if(g){SEL=g;bar.classList.add('on')}else hb=setTimeout(()=>{const x=$('#sb');if(x)x.classList.remove('on')},600)});
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('mark.mk');if(m&&!getSelection().toString())sh(m.dataset.ids.split(','))});
function newN(){if(!SEL)return;const s=SEL;getSelection().removeAllRanges();$('#sb').classList.remove('on');sh([],s)}
function sh(ids,sel){stopRec();blob=null;LAST=ids;SEL=sel||null;
 const ns=(cur.notes||[]).filter(n=>ids.includes(n.id));
 const qt=n=>n.q?`<div class="m">«${esc(n.q.length>70?n.q.slice(0,70)+'…':n.q)}»</div>`:'';
 if(role=='s')try{localStorage.setItem('ns_'+me.id,CS.reduce((a,c)=>a+(c.notes||[]).length,0))}catch(e){}
 $('#np').innerHTML=`<div class="row sp"><b>${sel?'ملاحظة جديدة':'الملاحظات'}</b><button class="g" onclick="closeS()">✕</button></div>
 ${sel?`<div class="m">المحدد: «${esc(cur.body.slice(sel.s,sel.e).slice(0,90))}»</div>`:ns.map(n=>`<div class="note">${qt(n)}${esc(n.t||'')}${n.done?' <span class="tag on">✓ طُبّقت</span>':''}<div class="row">${n.a?`<button class="g" data-p="${esc(n.a)}" onclick="play(this.dataset.p,this)">▶ تشغيل البصمة</button>`:''}${role=='s'?`<button class="g" data-n="${esc(n.id)}" onclick="dn(this.dataset.n,${!n.done})">${n.done?'تراجع':'تطبيق'}</button>`:''}${role=='t'?`<button class="d" data-n="${esc(n.id)}" onclick="rmN(this.dataset.n)">حذف</button>`:''}</div></div>`).join('')}
 ${role=='s'&&ns.some(n=>!n.done)?'<p class="m" style="font-size:13px">اضغط على الزر بعد التعديل وفق ملاحظات مشرفك</p>':''}
 <audio id="pv" controls hidden></audio>
 ${sel?`<textarea id="nt" style="min-height:80px" placeholder="ملاحظة مكتوبة (اختياري)"></textarea><div class="row"><button class="g" id="rc" onclick="rec()">🎤 تسجيل</button><span id="tm" class="m"></span><button id="sv" onclick="saveN()" style="margin-inline-start:auto">حفظ</button></div>`:''}
 ${role=='t'?'<p id="msg" class="m"></p>':''}`;
 $('#np').classList.add('open')}
async function play(p,b){b.disabled=true;const {data,error}=await sb.storage.from('voice').createSignedUrl(p,300);b.disabled=false;
 if(error)return alert('تعذر التشغيل');const a=$('#pv');a.hidden=false;a.src=data.signedUrl;a.play().catch(()=>{})}

/* ===== تسجيل الصوت (للأستاذ) ===== */
function stopRec(){if(R){const r=R;R=null;clearInterval(tmr);r.onstop=null;r.ondataavailable=null;r.stream.getTracks().forEach(t=>t.stop());try{r.stop()}catch(e){}}}
function closeS(){stopRec();$('#np').classList.remove('open')}
async function rec(){const b=$('#rc');if(R){R.stop();return}
 if(!navigator.mediaDevices||!window.isSecureContext)return say('الميكروفون غير متاح هنا. افتح الرابط (https) في Chrome أو Safari.',1);
 b.disabled=true;let st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){b.disabled=false;return say(e.name=='NotAllowedError'?'تم رفض إذن الميكروفون. فعّله من إعدادات الموقع.':'تعذر فتح الميكروفون ('+e.name+')',1)}
 b.disabled=false;
 const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
 try{R=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000})}
 catch(e){st.getTracks().forEach(t=>t.stop());return say('المتصفح لا يدعم التسجيل',1)}
 const ch=[];let s=0;R.ondataavailable=e=>ch.push(e.data);
 R.onstop=()=>{clearInterval(tmr);st.getTracks().forEach(t=>t.stop());blob=new Blob(ch,{type:R.mimeType||mt});R=null;
  const x=$('#tm');if(x){b.textContent='🎤 إعادة';x.textContent='تم التسجيل ('+Math.round(blob.size/1024)+' KB)'}};
 R.start();b.textContent='⏹ إيقاف';
 tmr=setInterval(()=>{s++;const x=$('#tm');if(x)x.textContent=s+' / 60 ث';if(s>=60&&R)R.stop()},1000)}
async function saveN(){const t=$('#nt').value.trim();if(!t&&!blob)return say('اكتب ملاحظة أو سجّل بصمة',1);
 if(R)return say('أوقف التسجيل أولاً',1);if(!SEL)return;
 const sv=$('#sv');sv.disabled=true;sv.textContent='جارٍ الحفظ...';
 const fail=m=>{sv.disabled=false;sv.textContent='حفظ';say(m,1)};
 const id=crypto.randomUUID(),n={id,o1:SEL.s,o2:SEL.e,q:cur.body.slice(SEL.s,SEL.e).slice(0,120),t};
 if(blob){const mt=(blob.type||'audio/mp4').split(';')[0],ext=mt.includes('mp4')?'m4a':'webm',p=`${stu}/${cur.id}/${id}.${ext}`;
  say('جارٍ رفع الصوت...');
  const {error}=await sb.storage.from('voice').upload(p,blob,{contentType:mt});
  if(error)return fail('فشل رفع الصوت: '+error.message);n.a=p}
 const {data:f}=await sb.from('chapters').select('notes').eq('id',cur.id).single();
 const notes=[...((f&&f.notes)||cur.notes||[]),n];
 const {error}=await sb.from('chapters').update({notes}).eq('id',cur.id);
 if(error)return fail(error.message);cur.notes=notes;blob=null;SEL=null;showC(cur.id);sh([id]);say('✓ تم الحفظ',2)}
async function dn(id,v){const {error}=await sb.rpc('mark_note',{p_chapter:cur.id,p_note:id,p_done:v});if(error)return alert('تعذر الحفظ: '+error.message);cur.notes.find(x=>x.id==id).done=v;showC(cur.id);sh(LAST)}
async function rmN(id){const n=cur.notes.find(x=>x.id==id);if(n&&n.a)await sb.storage.from('voice').remove([n.a]);
 const {data:f}=await sb.from('chapters').select('notes').eq('id',cur.id).single();
 const notes=((f&&f.notes)||cur.notes).filter(x=>x.id!=id);await sb.from('chapters').update({notes}).eq('id',cur.id);cur.notes=notes;showC(cur.id)}

/* ===== الطالب ===== */
async function sHome(){const {data:cs=[]}=await sb.from('chapters').select('*').order('created_at');CS=cs;stu=me.id;const {data:tn}=await sb.rpc('my_teacher_name');let sen=0;try{sen=+localStorage.getItem('ns_'+me.id)||0}catch(e){}const tot=cs.reduce((a,c)=>a+(c.notes||[]).length,0);
 A.innerHTML=`<div class="row sp"><h3>أهلاً ${esc(me.name)}</h3><button class="g" onclick="out()">خروج</button></div>${tn?`<p class="m">مشرفك .. ${esc(dr(tn))}</p>`:''}${tot>sen?'<div class="card" style="border:2px solid var(--a)">🔔 وصلتك ملاحظات جديدة من مشرفك</div>':''}
 <div id="ch"></div>
 ${cs.length?`<div class="row"><button class="d" onclick="delC()">${cs.length==2?'حذف النسخة الأولى (لرفع نسخة جديدة)':'حذف النسخة'}</button></div>`:''}
 ${cs.length<2?`<div class="card"><b>رفع فصل${cs.length?' معدّل':''}</b><input id="ti" placeholder="عنوان الفصل"><textarea id="bo" placeholder="الصق نص الفصل هنا"></textarea><button onclick="up()">رفع</button><p id="msg" class="m"></p></div>`:'<p class="m">لديك نسختان. لرفع نسخة جديدة احذف الأولى بعد أن تطبّق ملاحظاتها.</p>'}`;
 if(cs.length)showC(cs[cs.length-1].id)}
async function up(){const t=$('#ti').value.trim(),b=$('#bo').value.replace(/\r/g,'');if(!t||!b.trim())return say('اكتب العنوان والنص',1);
 if(b.length>200000)return say('النص أطول من الحد ('+b.length+' حرف، الأقصى 200000). قسّمه إلى فصلين.',1);
 say('جارٍ الرفع...');
 const {error}=await sb.from('chapters').insert({student_id:me.id,title:t,body:b});
 if(error)return say(error.message.includes('max_two')?'لديك نسختان. احذف الأولى أولاً.':error.message,1);sHome()}
async function delC(){
 if(!confirm('حذف هذه النسخة بملاحظاتها وبصماتها نهائياً؟ تأكد أنك طبّقت الملاحظات.'))return;await delCh(CS[0]);sHome()}

boot();
</script></body></html>
